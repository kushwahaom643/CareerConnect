<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Career<span>Connect</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs">Jobs</a>
            <a href="register.html" class="nav-btn">
                Create Account
            </a>
        </div>

    </nav>


    <main class="form-page">

        <div class="form-card">

            <div class="form-header">

                <div class="form-icon">
                    🔐
                </div>

                <p class="section-label">
                    WELCOME BACK
                </p>

                <h1>Login to CareerConnect</h1>

                <p>
                    Access your account and continue your career journey.
                </p>

            </div>


            <form action="login" method="post">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="form-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

    </main>


    <footer>

        <div class="footer-logo">
            Career<span>Connect</span>
        </div>

        <p>
            Connecting candidates with opportunities.
        </p>

    </footer>

</body>

</html>
