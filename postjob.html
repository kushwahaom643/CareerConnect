<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Post a Job | CareerConnect</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Career<span>Connect</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="jobs">
                Jobs
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html" class="nav-btn">
                Get Started
            </a>

        </div>

    </nav>


    <main class="form-page">


        <div class="form-card">


            <div class="form-header">

                <div class="form-icon">
                    🏢
                </div>

                <p class="section-label">
                    RECRUITER PORTAL
                </p>

                <h1>
                    Post a New Job
                </h1>

                <p>
                    Find the right candidate for your organization.
                </p>

            </div>


            <form action="postjob" method="post">


                <label>
                    Job Title
                </label>

                <input
                    type="text"
                    name="title"
                    placeholder="e.g. Java Developer"
                    required
                >


                <label>
                    Company Name
                </label>

                <input
                    type="text"
                    name="company"
                    placeholder="e.g. Tech Solutions"
                    required
                >


                <label>
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="e.g. Noida"
                    required
                >


                <label>
                    Salary
                </label>

                <input
                    type="text"
                    name="salary"
                    placeholder="e.g. 4-6 LPA"
                    required
                >


                <label>
                    Job Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Describe the job role and requirements..."
                    required
                ></textarea>


                <button type="submit">
                    Post Job
                </button>


            </form>


            <p class="form-footer">

                Looking for candidates?

                <a href="applicants">
                    View Applicants
                </a>

            </p>


        </div>


    </main>


    <footer>

        <div class="footer-logo">
            Career<span>Connect</span>
        </div>

        <p>
            Connecting candidates with opportunities.
        </p>

        <p class="copyright">
            © 2026 CareerConnect. College Project.
        </p>

    </footer>


</body>

</html>
